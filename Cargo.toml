[package]
name = "re5-save-editor-360-pc"
version = "1.0.0"
edition = "2021"
description = "RE5 Save Editor 360+PC: editor de save do Resident Evil 5 para Xbox 360 e PC"
license = "MIT"

[dependencies]
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-winit-software",
    "software-renderer-systemfonts",
    "unstable-winit-030",
    "raw-window-handle-06",
] }
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
num-bigint = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
